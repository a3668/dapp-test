<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>產品溯源系統</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="h4 mb-3">產品溯源系統（Sepolia 測試網）</h1>

      <!-- Wallet -->
      <div class="card mb-3">
        <div class="card-body">
          <button id="btnConnect" class="btn btn-primary">連接錢包</button>
          <div class="mt-3">
            <div><strong>錢包地址：</strong><span id="txtAddress">-</span></div>
            <div><strong>目前網路：</strong><span id="txtNetwork">-</span></div>
            <div><strong>使用者角色：</strong><span id="txtRole">-</span></div>
          </div>
          <div id="alertBox" class="alert alert-warning mt-3 d-none"></div>
        </div>
      </div>

      <div class="row g-3">
        <!-- Query -->
        <div class="col-12 col-lg-6">
          <div class="card">
            <div class="card-header">商品查詢</div>
            <div class="card-body">
              <div class="mb-2">
                <label class="form-label">商品編號</label>
                <input
                  id="qProductId"
                  type="number"
                  class="form-control"
                  placeholder="例如：1"
                />
              </div>
              <button id="btnExists" class="btn btn-outline-secondary me-2">
                檢查是否已登記
              </button>
              <button id="btnGetProduct" class="btn btn-outline-primary">
                查詢商品資料
              </button>
              <div id="outQuery" class="output mt-3"></div>
            </div>
          </div>
        </div>

        <!-- Register -->
        <div class="col-12 col-lg-6">
          <!-- 改動：預設隱藏，避免 JS 沒載入時直接顯示 VIP 功能 -->
          <div class="card d-none" id="vipSection">
            <div class="card-header">商品登記（VIP / 管理者）</div>
            <div class="card-body">
              <div class="mb-2">
                <label class="form-label">商品編號</label>
                <input
                  id="rProductId"
                  type="number"
                  class="form-control"
                  placeholder="例如：2"
                />
              </div>
              <div class="mb-2">
                <label class="form-label">商品名稱</label>
                <input
                  id="rName"
                  type="text"
                  class="form-control"
                  placeholder="例如：金門牡蠣"
                />
              </div>
              <div class="mb-2">
                <label class="form-label">產地</label>
                <input
                  id="rOrigin"
                  type="text"
                  class="form-control"
                  placeholder="例如：金門"
                />
              </div>
              <button id="btnRegister" class="btn btn-success">新增商品</button>
              <div id="outRegister" class="output mt-3"></div>
            </div>
          </div>
        </div>

        <!-- Admin -->
        <div class="col-12">
          <div class="card d-none" id="adminSection">
            <div class="card-header">VIP 管理（僅限管理者）</div>
            <div class="card-body">
              <div class="row g-2">
                <div class="col-12 col-lg-6">
                  <label class="form-label">VIP 錢包地址</label>
                  <input
                    id="vipAddress"
                    type="text"
                    class="form-control"
                    placeholder="0x..."
                  />
                </div>
                <div class="col-12 col-lg-6 d-flex align-items-end gap-2">
                  <button id="btnAddVip" class="btn btn-warning">
                    新增 VIP
                  </button>
                  <button id="btnRemoveVip" class="btn btn-danger">
                    移除 VIP
                  </button>
                  <button id="btnCheckVip" class="btn btn-outline-secondary">
                    查詢 VIP 狀態
                  </button>
                </div>
              </div>
              <div id="outAdmin" class="output mt-3"></div>
            </div>
          </div>
        </div>
      </div>

      <p class="text-muted small mt-3 mb-0">
        本系統需搭配 MetaMask，並使用 Sepolia 測試網。
      </p>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
